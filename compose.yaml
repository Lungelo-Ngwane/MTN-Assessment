services:
  api:
    build: .
    ports:
      - '127.0.0.1:${PORT:-3000}:3000'
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/api/v1/health').then(r => { if (!r.ok) process.exitCode = 1 }).catch(() => { process.exitCode = 1 })"
      interval: 15s
      timeout: 5s
      retries: 3
