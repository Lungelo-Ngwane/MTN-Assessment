name: API quality
on: [pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24.21.0
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm audit --omit=dev --include=optional
